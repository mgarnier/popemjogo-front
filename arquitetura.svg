<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Populacao em Jogo</title>
  <desc id="desc">O navegador acessa o frontend Nginx, que devolve arquivos estaticos e encaminha chamadas de API para o backend FastAPI. O backend consulta o IBGE e utiliza SQLite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#365572" />
    </marker>
  </defs>
  <rect width="1100" height="360" fill="#fff" />
  <g fill="none" stroke="#365572" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 215 110 H 290" />
    <path d="M 290 165 H 215" />
    <path d="M 485 135 H 560" />
    <path d="M 765 135 H 850" />
    <path d="M 660 185 V 265" />
  </g>
  <g fill="#f1f7fa" stroke="#365572" stroke-width="2">
    <rect x="40" y="85" width="175" height="100" rx="6" />
    <rect x="290" y="85" width="195" height="100" rx="6" />
    <rect x="560" y="85" width="205" height="100" rx="6" />
    <rect x="850" y="85" width="210" height="100" rx="6" />
    <path d="M 580 265 V 328 C 580 346 740 346 740 328 V 265 Z" />
    <ellipse cx="660" cy="265" rx="80" ry="15" fill="#f1f7fa" />
  </g>
  <g fill="#193248" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="127" y="141">Navegador</text>
    <text x="387" y="141">Frontend Nginx</text>
    <text x="662" y="141">Backend FastAPI</text>
    <text x="955" y="141">API pública do IBGE</text>
    <text x="660" y="316">SQLite</text>
  </g>
  <g fill="#365572" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="252" y="199">Arquivos estáticos</text>
    <text x="522" y="120">/api/*</text>
  </g>
</svg>